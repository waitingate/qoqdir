# Builds both versions on a Windows runner and runs every check with scripts\build.ps1 -Test, as on a PC: the unit
# tests, the exe checks, clippy, the command-line checks and both self-tests with the popup watch. Both exes and the
# logs are kept as artifacts. A check that fails here but passes on a PC probably hit something the runner lacks.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    # Each action is pinned to the commit of the release named beside it: a tag that is moved later can't change
    # what runs here.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes, so no token is left in the clone for the build to read

      # MinGW-w64 GCC with the UCRT runtime, as for releases (MSYS2's current release), CMake and
      # Ninja; no Visual Studio, as in the spec.
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e   # v2.33.0
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja

      # Rust for the GNU target, which links with that GCC, as it does with winlibs' on a PC.
      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --component clippy
          rustup default stable-x86_64-pc-windows-gnu

      # MSYS2's bin goes first on the PATH, ahead of the other MinGW copies on the runner, so the script takes its GCC,
      # windres and objdump. Cargo is on the PATH already.
      - name: Build and check both versions
        shell: pwsh
        run: |
          $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin;$env:PATH"
          g++ --version | Select-Object -First 1
          rustc --version
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build.ps1 -Test

      - name: Collect logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          # A self-test's own crash log lives in its folder, which stays behind only when a step crashed or hung.
          $logs = 'qoqdir-selftest.log', 'qoqdir-rs-selftest.log', 'qoqdir-crash.log',
            'qoqdir-selftest\qoqdir-crash.log', 'qoqdir-rs-selftest\qoqdir-crash.log'
          foreach ($f in $logs) {
            $p = Join-Path $env:TEMP $f
            if (Test-Path $p) { Copy-Item $p (Join-Path 'logs' ($f -replace '\\', '-')) }
          }
          Get-ChildItem logs
          # Each failed step and crash as an annotation of the run, which can be read without signing in, unlike the
          # log and the artifact.
          foreach ($log in Get-ChildItem logs -Filter *.log) {
            $lines = Get-Content $log.FullName
            if ($log.Name -like '*crash*') { $lines = $lines | Select-Object -First 3 }
            else { $lines = $lines | Where-Object { $_ -cmatch '^FAIL' } }
            foreach ($l in $lines) { "::error title=$($log.Name)::$($l -replace '%', '%25')" }
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        if: always()
        with:
          name: qoqdir
          path: |
            build/qoqdir.exe
            rust/target/release/qoqdir.exe
            logs/
          if-no-files-found: warn
