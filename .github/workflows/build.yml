# Builds qoqdir.exe and qoqdir-test.exe on a Windows runner and runs the unit tests, the self-test
# (qoqdir-test.exe, with the popup watch) and the command-line checks (qoqdir.exe, what users get).
# The exe and the logs are kept as artifacts. A step that fails here but passes on a PC probably hit
# something the runner lacks.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # MinGW-w64 GCC with the UCRT runtime, as for releases (MSYS2's current release), CMake and
      # Ninja; no Visual Studio, as in the spec.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja

      - name: Build
        shell: msys2 {0}
        run: |
          g++ --version | head -1
          # -Werror: a warning fails the build here as it does in scripts\build.ps1.
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-Werror
          cmake --build build

      # One exe, statically linked, well under 1 MB: no MinGW DLLs may be imported.
      - name: Check the exe is portable
        shell: msys2 {0}
        run: |
          objdump -p build/qoqdir.exe | grep 'DLL Name'
          # Only DLLs Windows protects (its KnownDLLs, comctl32 through the manifest, the CRT's API sets): any other
          # import, Windows would look for next to the exe first (docs/DEVELOPING.md).
          if objdump -p build/qoqdir.exe | grep 'DLL Name' | grep -ivE 'DLL Name: (KERNEL32|USER32|GDI32|ole32|OLEAUT32|SHELL32|SHLWAPI|COMCTL32|api-ms-win-crt-[a-z0-9-]+)\.dll$'; then
            echo '::error::qoqdir.exe imports a DLL Windows does not protect'; exit 1
          fi
          size=$(stat -c %s build/qoqdir.exe); echo "qoqdir.exe: $size bytes"
          test "$size" -lt 1048576 || { echo '::error::qoqdir.exe is 1 MB or more'; exit 1; }

      - name: Unit tests
        shell: msys2 {0}
        run: ctest --test-dir build -R unit_tests --output-on-failure

      # The self-test, with every new window from any process listed (spec 7.4).
      - name: Self-test with popup watch
        shell: pwsh
        run: powershell -NoProfile -File tests\watch-windows.ps1 -Exe build\qoqdir-test.exe

      - name: Command-line checks
        shell: pwsh
        run: powershell -NoProfile -File tests\cli-checks.ps1 -Exe build\qoqdir.exe

      - name: Collect logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          # The self-test's own crash log lives in its folder, which stays behind only when a step crashed or hung.
          foreach ($f in 'qoqdir-selftest.log', 'qoqdir-crash.log', 'qoqdir-selftest\qoqdir-crash.log') {
            $p = Join-Path $env:TEMP $f
            if (Test-Path $p) { Copy-Item $p (Join-Path 'logs' ($f -replace '\\', '-')) }
          }
          Get-ChildItem logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qoqdir
          path: |
            build/qoqdir.exe
            logs/
          if-no-files-found: warn
