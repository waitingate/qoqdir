# Builds qoqdir.exe and qoqdir-test.exe on a Windows runner and runs the unit tests, the self-test
# (qoqdir-test.exe, with the popup watch) and the command-line checks (qoqdir.exe, what users get).
# The exe and the logs are kept as artifacts. A step that fails here but passes on a PC probably hit
# something the runner lacks.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # MinGW-w64 GCC with the UCRT runtime, as for releases (MSYS2's current release), CMake and
      # Ninja; no Visual Studio, as in the spec.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja

      - name: Build
        shell: msys2 {0}
        run: |
          g++ --version | head -1
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      # One exe, statically linked, under 1 MB, importing only DLLs Windows protects: the rule is in the script,
      # shared with scripts\build.ps1 -Test and scripts\release.ps1. Run from the msys2 shell, so that the script
      # finds its objdump; Windows' PowerShell is named by its full path, since the shell's PATH may not hold it.
      - name: Check the exe is portable
        shell: msys2 {0}
        run: |
          "$(cygpath -u "$WINDIR")/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -ExecutionPolicy Bypass -File tests/exe-checks.ps1 -Exe build/qoqdir.exe

      - name: Unit tests
        shell: msys2 {0}
        run: ctest --test-dir build -R unit_tests --output-on-failure

      # The self-test, with every new window from any process listed (spec 7.4).
      - name: Self-test with popup watch
        shell: pwsh
        run: powershell -NoProfile -File tests\watch-windows.ps1 -Exe build\qoqdir-test.exe

      - name: Command-line checks
        shell: pwsh
        run: powershell -NoProfile -File tests\cli-checks.ps1 -Exe build\qoqdir.exe

      - name: Collect logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          # The self-test's own crash log lives in its folder, which stays behind only when a step crashed or hung.
          foreach ($f in 'qoqdir-selftest.log', 'qoqdir-crash.log', 'qoqdir-selftest\qoqdir-crash.log') {
            $p = Join-Path $env:TEMP $f
            if (Test-Path $p) { Copy-Item $p (Join-Path 'logs' ($f -replace '\\', '-')) }
          }
          Get-ChildItem logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qoqdir
          path: |
            build/qoqdir.exe
            logs/
          if-no-files-found: warn
