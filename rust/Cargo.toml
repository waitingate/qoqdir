[package]
name = "qoqdir" # also the exe name; in the code the app name is APP_NAME (main.rs)
version = "0.1.0"
edition = "2024"
description = "A light, fast, portable file manager for Windows"

[dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
# Needed by the #[implement] macro (used to write COM objects).
windows-core = "0.62.2"

[build-dependencies]
embed-manifest = "1.5.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"   # a bug stops the app loudly instead of continuing in a bad state
strip = true
