[package]
name = "qoqdir" # also the exe name; in the code the app name is APP_NAME (main.rs)
version = "0.3.2"
edition = "2024"
rust-version = "1.91"   # clippy checks the code against this (the self-test's thread_local consts need 1.91)
description = "A light, fast, portable file manager for Windows"
license = "MIT"

[dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
# Needed by the #[implement] macro (used to write COM objects).
windows-core = "0.62.2"

[features]
# The self-test (`--selftest`, src/selftest.rs) is only in a build with this feature, not in the exe you use:
#   cargo build --release --features selftest --target-dir target\selftest
selftest = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"   # a bug stops the app loudly instead of continuing in a bad state
overflow-checks = true   # an integer overflow stops it too, instead of quietly wrapping around
strip = true
